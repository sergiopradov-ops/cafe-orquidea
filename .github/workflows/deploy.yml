# Ola 1: solo existe orquidea-prod. Merge a main → revisión sin tráfico →
# smoke test sobre la URL con tag → 100% del tráfico.
# Cuando exista orquidea-dev (Ola 2), main → dev y tags v* → prod.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGION: us-central1
  SERVICE: web

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Hasta correr scripts/bootstrap-gcp.sh no existen las variables: no despliega.
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # requerido por Workload Identity Federation
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Variables de imagen
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/web/web:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build & push
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.SITE_URL }}" \
            --build-arg NEXT_PUBLIC_WHATSAPP_NUMBER="${{ vars.WHATSAPP_NUMBER }}" \
            --build-arg NEXT_PUBLIC_CONTACT_EMAIL="${{ vars.CONTACT_EMAIL }}" \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY="${{ vars.RECAPTCHA_SITE_KEY }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy revisión sin tráfico
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --no-traffic \
            --tag "sha-${SHORT_SHA}" \
            --quiet

      - name: Smoke test
        run: |
          BASE_URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          TAG_URL="${BASE_URL/https:\/\//https://sha-${SHORT_SHA}---}"
          echo "Probando ${TAG_URL}"
          for path in /api/health / /panaderia; do
            curl -fsS --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code} ${path}\n" "${TAG_URL}${path}"
          done

      - name: Promover a 100%
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --to-tags "sha-${SHORT_SHA}=100" \
            --quiet
